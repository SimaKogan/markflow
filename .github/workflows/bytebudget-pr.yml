# Copy to .github/workflows/bytebudget-pr.yml
# Builds the base branch and the PR, compares sizes and keeps ONE comment up to date.
name: Bundle size
on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci && npm run build
      - run: npx bytebudget --save-baseline "$RUNNER_TEMP/baseline.json" || true

      - uses: actions/checkout@v4
        with:
          clean: true
      - run: ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci && npm run build
      - name: Measure PR and compare with base
        run: |
          if [ -f "$RUNNER_TEMP/baseline.json" ]; then
            npx bytebudget --compare "$RUNNER_TEMP/baseline.json" --markdown "$RUNNER_TEMP/comment.md" --html report.html || true
          else
            npx bytebudget --markdown "$RUNNER_TEMP/comment.md" --html report.html || true
          fi

      - uses: actions/upload-artifact@v4
        with: { name: bytebudget-report, path: report.html }

      - name: Post or update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const body = fs.readFileSync(process.env.RUNNER_TEMP + '/comment.md', 'utf8')
            const marker = '<!-- bytebudget-report -->'
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
            const mine = comments.find(c => c.body && c.body.includes(marker))
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body })
            else await github.rest.issues.createComment({ owner, repo, issue_number, body })

      - name: Fail if a budget is exceeded
        run: npx bytebudget
